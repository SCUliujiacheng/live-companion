name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Native and browser fixture tests
        run: npm test
      - name: Extension integration and local API tests
        run: |
          npm run check
          node scripts/browser-smoke.mjs
          node scripts/config-smoke.mjs
      - name: Build distribution ZIPs
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Windows installer and portable application
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-applications
          path: dist-desktop/*.exe
